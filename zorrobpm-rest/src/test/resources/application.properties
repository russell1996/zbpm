#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:11001/zorrobpm-db}
spring.datasource.url=jdbc:h2:mem:test
#spring.datasource.username=${DB_USERNAME:zorrodev}
#spring.datasource.password=${DB_PASSWORD:zorrodev}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USERNAME:zorrodev}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:zorrodev}
spring.rabbitmq.port=${RABBITMQ_PORT:11002}

app.filesDir=target/files

# WO-SEC-12: disable rate-limit in test profile (tests set it explicitly when needed)
zorrobpm.security.rate-limit.enabled=false

# WO-SEC-13: enable ForwardedHeaderFilter for XFF tests
server.forward-headers-strategy=framework

# WO-OPS-1: expose /actuator/health in test profile
# WO-OBS-1: + prometheus (authenticated scrape — JwtAuthFilter unchanged, 401 anonymous)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
