# WO-CFG-1: файл ПЕРЕИМЕНОВАН из `application.properties` — по той же причине, что и в
# zorrobpm-engine: `classpath:/application.properties` загружается как один ресурс, и в
# fat-jar его перекрывал `BOOT-INF/classes/application.properties` модуля zorrobpm-app.
# Подключён аннотацией PropertySource в
# `com.zorrodev.bpm.rest.configuration.RestPropertiesSource`; `spring.config.import` здесь
# НЕ используется намеренно (он даёт импортированному документу приоритет выше
# импортирующего — измерено, см. EnginePropertiesSource). Ключи и умолчания не менялись.
#
# ВНИМАНИЕ: соседний `application-prod.yml` НЕ переименован — профильный документ
# `classpath:/application-prod.yml` в fat-jar резолвится в этот файл (одноимённого
# у zorrobpm-app нет), поэтому он работает и работать продолжает. Если у zorrobpm-app
# появится свой `application-prod.yml` — перекрытие вернётся; сторожевой тест
# noTwoModulesShipTheSameProfileDocument это увидит.
spring.application.name=zorrobpm-engine

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zorrobpm-db}
spring.datasource.username=${DB_USERNAME:zorrodev}
spring.datasource.password=${DB_PASSWORD:zorrodev}

app.filesDir=${APP_FILES_DIR:${user.home}/.zorrobpm/files}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USERNAME:zorrodev}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:zorrodev}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}

# WO-INT-9: RabbitMQ Management API base-url для per-system провижининга
# (формат валидируется fail-fast — RabbitMqManagementUrlValidator, P-41:
# новая ручка проходит ту же проверку, что соседние security-настройки).
zorrobpm.rabbitmq.management.base-url=${RABBITMQ_MGMT_BASE_URL:http://localhost:15672}

# WO-REL-12 (R-02): broker publisher confirms + mandatory returns (see RabbitConfiguration).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

server.forward-headers-strategy=framework

# WO-OBS-1 (G-C approved): expose /actuator/prometheus for authenticated scrape.
# Auth untouched: JwtAuthFilter deny-by-default still requires a credential
# (only /actuator/health is public) — scrape with a service API key.
management.endpoints.web.exposure.include=health,prometheus

# WO-VT-1 п.6: шаблоны переменных. Ключ ОБЯЗАН дублироваться в app-файле
# (урок C8-36 F-7: fat-jar перекрывает этот файл, единственный рабочий путь —
# relaxed binding env-имени прямо на ключ). Env-имя: ZORROBPM_UI_VARIABLE_PRESETS_ENABLED.
zorrobpm.ui.variable-presets.enabled=${ZORROBPM_UI_VARIABLE_PRESETS_ENABLED:true}
