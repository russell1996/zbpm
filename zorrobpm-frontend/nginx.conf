# ZorroBPM frontend — serves the SPA under /ui/ and proxies API calls to the backend.
#
# The external production reverse proxy (https://zorro.i-smet.kz) forwards traffic to this container.
# Inside the Docker network the backend is reached by its service name `app` (resolved by Docker DNS),
# never by a hardcoded IP. The frontend uses relative `/api` routes only.

server {
    listen 80;
    server_name _;

    # Container-level health probe
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Security headers (WO-AUD-4 F19)
    # WO-SEC-30b: 'unsafe-eval' removed — bpmn-js, @bpmn-io/form-js, and feelin
    # do not use eval() or new Function(). Verified by grep of node_modules.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # HSTS: effective when the external proxy terminates SSL (https://zorro.i-smet.kz)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API: strip /api prefix, proxy to backend
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://app:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    # Swagger UI + OpenAPI docs — proxied straight through (no prefix to strip, springdoc
    # serves these paths verbatim). Previously undocumented/unrouted here: this container's
    # nginx had no rule for them at all, leaving them entirely dependent on the external
    # production reverse proxy's own (unversioned, unverified) config.
    location /swagger-ui/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://app:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://app:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA under /ui/ prefix — serve static assets, fall back to index.html
    location /ui/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /ui/index.html;
    }

    # index.html must be revalidated on every navigation (WO-MT-9e).
    # Without no-cache the browser serves a stale index after deploy, referencing
    # chunk filenames that no longer exist → white screen / "Failed to fetch" error.
    location = /ui/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/security-headers.conf;
    }

    # Long-cache hashed build assets under /ui/assets/
    location /ui/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Root redirect to /ui/
    location = / {
        return 302 /ui/;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
