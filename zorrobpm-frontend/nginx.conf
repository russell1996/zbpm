# ZorroBPM frontend — serves the SPA under /ui/ and proxies API calls to the backend.
#
# The external production reverse proxy (https://zorro.i-smet.kz) forwards traffic to this container.
# Inside the Docker network the backend is reached by its service name `app` (resolved by Docker DNS),
# never by a hardcoded IP. The frontend uses relative `/api` routes only.

# WO-SEC-52: global pre-auth DoS backstop for ALL proxied routes (CTO decision: both
# layers — this nginx level is a crude raw-flood gate before traffic reaches the JVM;
# the app-level RateLimitFilter keeps doing precise per-account/per-key limiting on
# top, including the login limit which stays as-is).
# 30 r/s per client IP with a burst of 60 absorbs normal UI page loads (index +
# dozens of hashed assets fire at once) while capping scanners/flooders.
limit_req_zone $binary_remote_addr zone=global_perip:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # WO-SEC-52 (P-63/G13): this container sits behind the external prod reverse proxy.
    # Without real_ip the limit_req key ($binary_remote_addr) is the PROXY address for
    # ALL visitors -> one shared bucket -> 429 on SPA chunks for any concurrent users.
    # real_ip_header + set_real_ip_from rewrite the client address to the real visitor.
    # TODO(CTO): replace 10.0.0.0/8 with the ACTUAL production proxy CIDR. The value is
    # environment-specific and MUST be supplied at deploy; a wrong/absent CIDR leaves the
    # bucket keyed on the proxy (the exact P-63 failure mode). See report escalation note.
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # WO-SEC-52: applies to every PROXIED route (API, swagger, docs, SPA assets/index).
    # Intentionally EXEMPT: /healthz (orchestrator probe — must never be throttled) and
    # / (trivial 302 redirect). Both use `return` in the REWRITE phase, which runs before
    # the PREACCESS phase where limit_req lives, so they are excluded by design, not by
    # accident. See the location blocks below.
    limit_req zone=global_perip burst=60 nodelay;
    limit_req_status 429;

    # Container-level health probe.
    # EXEMPT from global limit_req (see server-block note): a throttled probe would make
    # the orchestrator mark the pod unhealthy and kill it.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Security headers (WO-AUD-4 F19).
    # WO-SEC-48: this used to duplicate the CSP/header list inline here, which drifted from
    # snippets/security-headers.conf (the /ui/index.html and /ui/assets/ locations below, which
    # define their own add_header for caching, do NOT inherit these and were silently served a
    # DIFFERENT policy — the one in the snippet). Now there is exactly one place the policy is
    # defined; every location — this one included — includes the same file.
    include snippets/security-headers.conf;

    # API: strip /api prefix, proxy to backend
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://app:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    # Swagger UI + OpenAPI docs — proxied straight through (no prefix to strip, springdoc
    # serves these paths verbatim). Previously undocumented/unrouted here: this container's
    # nginx had no rule for them at all, leaving them entirely dependent on the external
    # production reverse proxy's own (unversioned, unverified) config.
    location /swagger-ui/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://app:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://app:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA under /ui/ prefix — serve static assets, fall back to index.html
    location /ui/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /ui/index.html;
    }

    # index.html must be revalidated on every navigation (WO-MT-9e).
    # Without no-cache the browser serves a stale index after deploy, referencing
    # chunk filenames that no longer exist → white screen / "Failed to fetch" error.
    location = /ui/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/security-headers.conf;
    }

    # Long-cache hashed build assets under /ui/assets/
    location /ui/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Root redirect to /ui/.
    # EXEMPT from global limit_req (see server-block note): trivial 302, no backend load;
    # throttling it would only add risk of breaking initial navigation for no real gain.
    location = / {
        return 302 /ui/;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
