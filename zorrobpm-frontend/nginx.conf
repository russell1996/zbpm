# ZorroBPM frontend — serves the SPA under /ui/ and proxies API calls to the backend.
#
# The external production reverse proxy (https://zorro.i-smet.kz) forwards traffic to this container.
# Inside the Docker network the backend is reached by its service name `app` (resolved by Docker DNS),
# never by a hardcoded IP. The frontend uses relative `/api` routes only.

# WO-SEC-52: global pre-auth DoS backstop for ALL proxied routes (CTO decision: both
# layers — this nginx level is a crude raw-flood gate before traffic reaches the JVM;
# the app-level RateLimitFilter keeps doing precise per-account/per-key limiting on
# top, including the login limit which stays as-is).
# 30 r/s per client IP with a burst of 60 absorbs normal UI page loads (index +
# dozens of hashed assets fire at once) while capping scanners/flooders.
limit_req_zone $binary_remote_addr zone=global_perip:10m rate=30r/s;

# WO-OBS-2: map for Grafana WebSocket live (must be in http context, outside server)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# WO-OBS-4: ZBPM role -> Grafana role for auth.proxy (SUPER_ADMIN => Admin, everything else => Viewer).
map $auth_role $grafana_role {
    default 'Viewer';
    SUPER_ADMIN 'Admin';
}

# Live-caught 2026-09-14: the external TLS-terminating proxy (outside this container, S1 —
# unknown CIDR) forwards to us over plain HTTP internally, so $scheme here is always "http"
# regardless of what the real browser used. Every `proxy_set_header X-Forwarded-Proto $scheme`
# below therefore told Grafana every request was insecure HTTP even over a real https:// browser
# session -- Grafana's own CSRF/Origin same-site check rejected state-changing calls
# (POST /api/ds/query, WebSocket /api/live/ws) with 403 while plain GETs (page load, dropdown
# label-values) kept working, which is exactly the "dashboards load, panels never get data"
# symptom reported live. Prefer whatever the upstream edge already set; only fall back to our
# own $scheme if it set nothing at all.
map $http_x_forwarded_proto $real_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # WO-SEC-52 (P-63/G13): this container sits behind the external prod reverse proxy.
    # Without real_ip the limit_req key ($binary_remote_addr) is the PROXY address for
    # ALL visitors -> one shared bucket -> 429 on SPA chunks for any concurrent users.
    # real_ip_header + set_real_ip_from rewrite the client address to the real visitor.
    # TODO(CTO): replace 10.0.0.0/8 with the ACTUAL production proxy CIDR. The value is
    # environment-specific and MUST be supplied at deploy; a wrong/absent CIDR leaves the
    # bucket keyed on the proxy (the exact P-63 failure mode). See report escalation note.
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # WO-SEC-52: applies to every PROXIED route (API, swagger, docs, SPA assets/index).
    # Intentionally EXEMPT: /healthz (orchestrator probe — must never be throttled) and
    # / (trivial 302 redirect). Both use `return` in the REWRITE phase, which runs before
    # the PREACCESS phase where limit_req lives, so they are excluded by design, not by
    # accident. See the location blocks below.
    limit_req zone=global_perip burst=60 nodelay;
    limit_req_status 429;

    # Container-level health probe.
    # EXEMPT from global limit_req (see server-block note): a throttled probe would make
    # the orchestrator mark the pod unhealthy and kill it.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Security headers (WO-AUD-4 F19).
    # WO-SEC-48: this used to duplicate the CSP/header list inline here, which drifted from
    # snippets/security-headers.conf (the /ui/index.html and /ui/assets/ locations below, which
    # define their own add_header for caching, do NOT inherit these and were silently served a
    # DIFFERENT policy — the one in the snippet). Now there is exactly one place the policy is
    # defined; every location — this one included — includes the same file.
    include snippets/security-headers.conf;

    # API: strip /api prefix, proxy to backend
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://app:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_forwarded_proto;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    # Swagger UI + OpenAPI docs — proxied straight through (no prefix to strip, springdoc
    # serves these paths verbatim). Previously undocumented/unrouted here: this container's
    # nginx had no rule for them at all, leaving them entirely dependent on the external
    # production reverse proxy's own (unversioned, unverified) config.
    location /swagger-ui/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://app:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_forwarded_proto;
    }

    location /v3/api-docs {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://app:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_forwarded_proto;
    }

    # SPA under /ui/ prefix — serve static assets, fall back to index.html
    location /ui/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /ui/index.html;
    }

    # index.html must be revalidated on every navigation (WO-MT-9e).
    # Without no-cache the browser serves a stale index after deploy, referencing
    # chunk filenames that no longer exist → white screen / "Failed to fetch" error.
    location = /ui/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/security-headers.conf;
    }

    # Long-cache hashed build assets under /ui/assets/
    location /ui/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    # WO-OBS-4: auth subrequest for /grafana/ — validates the ZBPM session cookie
    # against the backend and returns identity headers. Internal only (no direct access).
    # Same variable+resolver pattern as /grafana/ below: app:8080 must resolve at runtime,
    # not bake a startup-time DNS dependency into the config.
    location = /_zbpm_auth {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        # NOTE: proxy_pass with a variable IGNORES any URI part in the value and appends
        # the original subrequest URI (would hit app as /_zbpm_auth → 404). Host goes in
        # the variable (runtime DNS), the fixed URI stays literal — exact-match location
        # has no suffix, so upstream always receives /auth/verify.
        set $auth_host app:8080;
        proxy_pass http://$auth_host/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # WO-OBS-4: role-enforcing variant for /prometheus/ (Prometheus has no RBAC).
    # Same mechanics as /_zbpm_auth; the fixed query makes the backend 403
    # non-SUPER_ADMIN sessions while 401 (no session) still redirects to login.
    location = /_zbpm_auth_admin {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_admin_host app:8080;
        proxy_pass http://$auth_admin_host/auth/verify?requireRole=SUPER_ADMIN;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # WO-OBS-2: Grafana behind the same nginx, subpath /grafana (principle 2: Grafana is a neighbour, not a child of SPA).
    # When the observability overlay is NOT up, grafana:3000 does not resolve — nginx returns 502, mapped to 404 so the main stack looks untouched (criterion 6).
    # WO-OBS-4: gated by auth_request (ZBPM session); identity flows as X-WEBAUTH-* headers for Grafana auth.proxy.
    # 401 from the subrequest (logged out / bad cookie) redirects to SPA login, preserving the target.
    location /grafana/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://grafana:3000;
        include snippets/security-headers-neighbor-app.conf;
        auth_request /_zbpm_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_role $upstream_http_x_auth_role;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_forwarded_proto;
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-WEBAUTH-ROLE $grafana_role;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        error_page 401 = @grafana_login_redirect;
        error_page 502 =404 /grafana-not-available.html;
    }

    # WO-OBS-4: logged-out (or bad-cookie) visitor hitting /grafana/ lands on SPA login,
    # which returns them to /grafana/ after a successful login.
    location @grafana_login_redirect {
        return 302 /ui/login?redirect=/grafana/;
    }

    # WO-OBS-4: Prometheus UI behind the same ZBPM session gate. Prometheus has NO
    # role model of its own (unlike Grafana auth.proxy + role-map) — anyone who
    # reaches it sees everything (targets, unrestricted PromQL). So on top of the
    # same /_zbpm_auth subrequest we enforce the role HARD here in nginx: only
    # SUPER_ADMIN passes (the frontend icons are cosmetic only and must never be
    # the real gate). 401 (no session) reuses the login redirect; 403 (wrong role)
    # is terminal. Same variable+resolver pattern as /grafana/ above.
    location /prometheus/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://prometheus:9090;
        include snippets/security-headers-neighbor-app.conf;
        # Role gate lives in the SUBREQUEST, not in a location-level `if`:
        # auth_request_set variables exist only AFTER the subrequest, while `if`
        # evaluates before it — `if ($auth_role != SUPER_ADMIN)` 403s everyone
        # including SUPER_ADMIN (proven live: no-cookie hit returned 403, not the
        # login redirect). /auth/verify?requireRole=SUPER_ADMIN answers 401 (no
        # session → login redirect below) or 403 (valid session, wrong role).
        auth_request /_zbpm_auth_admin;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_forwarded_proto;
        # NOTE (отклонение от буквы спеки WO: там «переиспользуй существующий redirect»):
        # общий @grafana_login_redirect вёл бы обратно на /grafana/, ломая живой flow
        # «logout → /prometheus/ → login → назад». Отдельный redirect с правильным target.
        error_page 401 = @prometheus_login_redirect;
        error_page 502 =404 /grafana-not-available.html;
    }

    # WO-OBS-4: post-login target for the Prometheus flow (mirror of the Grafana one).
    location @prometheus_login_redirect {
        return 302 /ui/login?redirect=/prometheus/;
    }

    location = /prometheus {
        return 302 /prometheus/;
    }

    location = /grafana {
        return 302 /grafana/;
    }

    location = /grafana-not-available.html {
        internal;
        add_header Content-Type text/plain;
        return 404 'Grafana not available — observability overlay not running (docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d)';
    }

    # Root redirect to /ui/.
    # EXEMPT from global limit_req (see server-block note): trivial 302, no backend load;
    # throttling it would only add risk of breaking initial navigation for no real gain.
    location = / {
        return 302 /ui/;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
