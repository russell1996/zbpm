# ZorroBPM frontend — serves the SPA and proxies API calls to the backend.
#
# The external production reverse proxy (https://zorro.i-smet.kz) forwards traffic to this container.
# Inside the Docker network the backend is reached by its service name `app` (resolved by Docker DNS),
# never by a hardcoded IP. The frontend uses relative `/api` routes only.

upstream zorrobpm_backend {
    # `app` = backend service name in docker-compose; APP_UPSTREAM lets compose override host:port if needed
    server app:8080;
}

server {
    listen 80;
    server_name _;

    # Container-level health probe (used by HEALTHCHECK / external monitoring)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # API: strip the /api prefix so it maps onto the backend's root-context endpoints
    # (e.g. /api/process-definitions -> http://app:8080/process-definitions)
    location /api/ {
        proxy_pass http://zorrobpm_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # BPMN XML deploys can be large
        client_max_body_size 25m;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
