# WO-SEC-48: single source of truth for security headers — included in EVERY location, including
# the server block's own default location, so no location can silently diverge from this file by
# defining its own add_header (nginx does not inherit server-level add_header into a location that
# has any add_header of its own). Do not duplicate these headers with `add_header` anywhere else.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
# HSTS: effective when the external proxy terminates SSL (https://zorro.i-smet.kz)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
