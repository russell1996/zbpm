# WO-OBS-2/4: Grafana and Prometheus are neighbour apps behind this nginx, not part of the
# ZBPM SPA -- their own JS bundles need script-src allowances the SPA's own strict policy
# (snippets/security-headers.conf: script-src 'self' only) does not grant. Live-caught
# 2026-09-14: user reported both /grafana/ and /prometheus/ as blank/white screens -- assets
# downloaded fine (visible in the browser's network tab) but the SPA's CSP, inherited into
# every location by default (nginx add_header inheritance), silently blocked their scripts
# from EXECUTING, with no visible network-level error. A location that sets its own add_header
# breaks inheritance from the server block (same gotcha WO-SEC-48 already documented for
# snippets/security-headers.conf itself) -- this file is included INSTEAD of the strict one
# in the /grafana/ and /prometheus/ locations, never both.
#
# Still gated by SUPER_ADMIN-only auth (Prometheus) / the shared ZBPM session (Grafana) at the
# nginx layer before any of this is reached -- loosening script-src here does not touch the
# SPA's own policy at all.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
