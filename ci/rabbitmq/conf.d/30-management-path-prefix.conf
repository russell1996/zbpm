# WO-QW-12 (QW12-1): management UI брокера живёт под префиксом /rabbitmq, чтобы nginx мог
# отдать его на внешнем домене (https://test-zbpm.telecom.kz/rabbitmq/) рядом с /grafana/ и
# /prometheus/.
#
# Почему это нужно именно в конфиге, а не в nginx: без префикса UI отдаёт АБСОЛЮТНЫЕ ссылки
# (/api/overview, /js/main.js), и под подпутём они уходят мимо маршрута. Префикс заставляет
# раздачу относительной (css/main.css, js/main.js), поэтому всё грузится под /rabbitmq/.
#
# Чем задано (выяснено прогоном на образе rabbitmq:4.1-management-alpine, не по памяти):
# образ читает /etc/rabbitmq/conf.d/*.conf — там уже лежит его собственный 10-defaults.conf,
# и монтируемый рядом файл подхватывается. Значение доезжает до узла:
#   rabbitmqctl eval 'application:get_env(rabbitmq_management, path_prefix).'  ->  {ok,"/rabbitmq"}
# Переживает рестарт контейнера (проверено docker restart). AMQP 5672 и management 15672
# продолжают слушать (rabbitmq-diagnostics -q listeners).
#
# ПОБОЧНЫЙ ЭФФЕКТ, о котором нужно знать оператору: настройка узловая, поэтому корень
# management-UI теперь отдаёт 301-редирект на /rabbitmq/ вместо самой страницы.
#   http://<host>:9300/           -> 301  Location: .../rabbitmq/   (браузер идёт по редиректу,
#                                                                закладка продолжает работать)
#   http://<host>:9300/rabbitmq/  -> 200  text/html
# Скрипт, дёргающий http://<host>:9300/api/... БЕЗ -L, после этого перестанет работать:
# путь теперь /rabbitmq/api/....
management.path_prefix = /rabbitmq