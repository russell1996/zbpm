# WO-SCALE-3 soak rig — round-robin front for soak-app1/2/3.
#
# Deliberately plain round-robin (nginx's upstream default with no
# directive added) — no ip_hash, no `hash $cookie_...`, no least_conn.
# The whole point of this rig is that ANY request, including two
# consecutive requests from the same client/token, can land on a
# different replica. If this ever grows sticky session affinity it stops
# proving what WO-SCALE-3 needs proven and starts hiding the bugs it
# exists to catch.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream zorrobpm_app {
        server soak-app1:8080;
        server soak-app2:8080;
        server soak-app3:8080;
        # no keepalive directive with a hash/ip_hash — plain round-robin.
    }

    server {
        listen 80;

        # SSE (GET /events/... or similar) must not be buffered or it stops
        # being "live" and the soak can't observe cross-replica delivery
        # latency. Buffering off + chunked passthrough applies to every
        # location here, SSE included — there's no separate REST payload
        # size concern in this rig worth trading it away for.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # SSE connections are long-lived by design; don't let nginx's
        # default 60s read timeout kill them mid-soak.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location / {
            proxy_pass http://zorrobpm_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
