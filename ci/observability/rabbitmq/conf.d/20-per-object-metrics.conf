# WO-OBS-5: per-object Prometheus metrics on the broker.
# Upstream RabbitMQ 3.13 default is return_per_object_metrics=false (global
# aggregates only, e.g. bare rabbitmq_queue_messages with no labels), which
# makes any {queue=...} selector — including the DLQ alert's
# increase(rabbitmq_queue_messages{queue=~".*dlq"}[15m]) — structurally
# unmatchable (escalation №4). Single-file mount into /etc/rabbitmq/conf.d/
# (the image's own 10-defaults.conf stays untouched).
prometheus.return_per_object_metrics = true
