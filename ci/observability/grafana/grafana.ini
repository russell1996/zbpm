# WO-OBS-4: Grafana minimal config — only settings not covered by env vars.
# Auth.proxy fully configured via GF_AUTH_PROXY_* env vars in compose (works in 11.x).
# Admin password ONLY via GRAFANA_ADMIN_PASSWORD env (fail-fast, WO-OBS-2 pattern).
[server]
root_url = %(protocol)s://%(domain)s/grafana/
serve_from_sub_path = true

[users]
allow_sign_up = false
auto_assign_org_role = Viewer

[unified_alerting]
enabled = true