apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: PBFA97CFB590B2093
    access: proxy
    # WO-OBS-6 follow-up (live-caught 2026-09-14): Prometheus runs with
    # --web.route-prefix=/prometheus/ (docker-compose.observability.yml) -- ALL its
    # API endpoints live under that prefix now, not bare /api/v1/*. Without it here,
    # every Grafana panel/variable query 404s (confirmed live: dashboard template
    # variable queries to /api/v1/label/instance/values all returned 404) -- panels
    # render but show no data, which looks like "nothing works" even though the
    # dashboards themselves loaded and SSO auth succeeded.
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: false
