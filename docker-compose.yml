name: zorrobpm

services:
  postgres:
    image: postgres:16-alpine
    container_name: zorrobpm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-zorrobpm-db}
      POSTGRES_USER: ${DB_USERNAME:-zorrodev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zorrodev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-zorrodev} -d ${DB_NAME:-zorrobpm-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zorrobpm

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zorrobpm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-zorrodev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-zorrodev}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"        # AMQP
      - "${RABBITMQ_MGMT_PORT:-9300}:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zorrobpm

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zorrobpm-app:${APP_TAG:-latest}
    container_name: zorrobpm-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-zorrobpm-db}
      DB_USERNAME: ${DB_USERNAME:-zorrodev}
      DB_PASSWORD: ${DB_PASSWORD:-zorrodev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-zorrodev}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-zorrodev}
      APP_FILES_DIR: /app/files
    volumes:
      - app-files:/app/files
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - zorrobpm

  # Vue SPA served by nginx; also reverse-proxies /api -> app:8080 inside the network.
  # The external production proxy (https://zorro.i-smet.kz) forwards to this service.
  frontend:
    build:
      context: ./zorrobpm-frontend
      dockerfile: Dockerfile
    image: zorrobpm-frontend:${FRONTEND_TAG:-latest}
    container_name: zorrobpm-frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - zorrobpm

volumes:
  postgres-data:
  rabbitmq-data:
  app-files:

networks:
  zorrobpm:
    driver: bridge
