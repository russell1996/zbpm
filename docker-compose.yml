name: zorrobpm

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: zorrobpm-postgres
    restart: unless-stopped
    # WO-REL-38: commit-timestamps для порядка ленты событий (FeedPositionAssigner
    # читает pg_xact_commit_timestamp(xmin); контекст postmaster — только через
    # командную строку. Пустой volume после этого флага стартует чисто; на
    # СУЩЕСТВУЮЩЕМ volume старые строки без меток добираются fallback-проходом
    # джоба по sequence — простоя/ресета данных не нужно).
    command: ["postgres", "-c", "track_commit_timestamp=on"]
    environment:
      POSTGRES_DB: ${DB_NAME:-zorrobpm-db}
      POSTGRES_USER: ${DB_USERNAME:-zorrodev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zorrodev}
      TZ: Asia/Almaty
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # WO-SEC-27: bind to loopback only — the app reaches PG via the docker network (postgres:5432),
      # so host publication is not needed and must never be exposed on 0.0.0.0. Admin access via SSH tunnel.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-zorrodev} -d ${DB_NAME:-zorrobpm-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # WO-SEC-50 (H5): generous safety-net ceilings, not tight capacity tuning — real prod
    # hardware specs weren't available to size these precisely; the goal here is only to stop a
    # runaway leak/noisy-neighbor container from starving the whole host. Revisit once actual
    # usage is measured.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          memory: 256m
    networks:
      - zorrobpm

  rabbitmq:
    # WO-OBS-9: 3.13.7 → 4.1.8 (major, миграционно проверен: налитые classic
    # 2000+500 сообщений, CQv1→v2-конверсия ~5ms/сообщение, 0 потерь, md5 тел
    # совпали; клиент spring-amqp 4.0.4 совместим по матрице вендора; ключ
    # prometheus.return_per_object_metrics в 4.x не переименован, метрики
    # {queue=...} проверены живьём; плагины management/prometheus на месте).
    # Тег+digest синхронизированы с CI-файлом ci/docker-compose.rabbit.yml
    # (критерий 3: одна версия везде). Digest — list-digest 4.1.8, сверен
    # `docker pull` 2026-09-18 (pull-дайджест совпал побайтово, образ на месте).
    # NB: downgrade официально не поддерживается вендором; Khepri (khepri_db)
    # держать ВЫКЛЮЧЕННЫМ до отдельного решения CTO — см. runbook.
    image: rabbitmq:4.1-management-alpine@sha256:a3ae2541e604917be93f562ed6b2a8a0c9e52e4945978f6d152e49bd9235a809
    container_name: zorrobpm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-zorrodev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-zorrodev}
      TZ: Asia/Almaty
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # WO-OBS-5: per-object prometheus metrics (single-file mount — image's
      # /etc/rabbitmq/conf.d/10-defaults.conf stays in place).
      - ./ci/observability/rabbitmq/conf.d/20-per-object-metrics.conf:/etc/rabbitmq/conf.d/20-per-object-metrics.conf:ro
      # WO-QW-12 (QW12-1): management UI под префиксом /rabbitmq — чтобы nginx отдавал его на
      # внешнем домене /rabbitmq/ под SUPER_ADMIN-гейтом. Конфиг, не env: переживает рестарт,
      # а `ports:` ниже не меняется (порт 9300 и AMQP 5672 — как были).
      - ./ci/rabbitmq/conf.d/30-management-path-prefix.conf:/etc/rabbitmq/conf.d/30-management-path-prefix.conf:ro
    ports:
      # INTENDED / NORMAL — publish on all host interfaces. DO NOT re-restrict to 127.0.0.1.
      # The host lives inside a protected network perimeter (not reachable from the public
      # internet), and LAN consumers depend on these ports: the test k8s app connects to
      # 192.0.2.111:5672 (AMQP) and the management UI is used at 192.0.2.111:9300.
      # This reverts SEC-27a, whose loopback lockdown broke those consumers and whose
      # internet-exposure premise did not hold. Any future "harden broker ports" WO must
      # first confirm the host is actually internet-exposed — it is not.
      - "${RABBITMQ_PORT:-5672}:5672"        # AMQP
      - "${RABBITMQ_MGMT_PORT:-9300}:15672"  # management UI
    expose:
      - "15692"  # WO-OBS-2: rabbitmq_prometheus metrics (no host publish, same network as prometheus)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          memory: 128m
    networks:
      - zorrobpm

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zorrobpm-app:${APP_TAG:-latest}
    container_name: zorrobpm-app
    restart: unless-stopped
    # WO-QW-9 (NEW4-09): graceful shutdown просит до 25с
    # (spring.lifecycle.timeout-per-shutdown-phase), дефолт Docker — 10с до
    # SIGKILL. Без этого активные HTTP/SSE-запросы убиваются раньше, чем
    # приложение успевает их корректно завершить (инвариант WO-REL-23).
    # 35с = 25с graceful + запас на завершение самого entrypoint'а.
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Run under the prod profile so application-prod.yml applies (rate-limit, CORS allowlist,
      # secure cookies, fail-fast on default JWT secret). Override with SPRING_PROFILES_ACTIVE if needed.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-zorrobpm-db}
      DB_USERNAME: ${DB_USERNAME:-zorrodev}
      DB_PASSWORD: ${DB_PASSWORD:-zorrodev}
      # WO-SEC-82: the soft CredentialsValidator (enforce-db-creds flag) was removed as a
      # duplicate of the hard DbRabbitPasswordValidator (WO-SEC-80, unconditional FATAL outside
      # dev/test). This env is no longer consumed by anything — kept for CTO decision at review
      # (remove or keep as no-op); a correct .env value still never hurts, it just does nothing.
      ZORROBPM_SECURITY_ENFORCE_DB_CREDS: ${ZORROBPM_SECURITY_ENFORCE_DB_CREDS:-false}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-zorrodev}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-zorrodev}
      # WO-INT-9: Management API для per-system провижининга (внутри сети — имя сервиса).
      # WO-QW-12 (ДОПОЛНЕНИЕ CTO): путь /rabbitmq ОБЯЗАТЕЛЕН и не косметика. Брокер
      # стартует с management.path_prefix = /rabbitmq (старый conf.d выше), а сам
      # management-HTTP без префикса на таком брокере отвечает 404 — проверено живым
      # прогоном: GET/PUT/DELETE /api/users/<login> -> 404, /rabbitmq/api/... -> 200/201.
      # Без префикса в base-url провижининг SYSTEM-юзера падал бы fail-closed 503
      # (getBrokerUser читал бы 404 «нет аккаунта», PUT /api/users -> 404 -> 503) —
      # то есть выдача и отзыв брокерских учёток воркеров были бы сломаны на проде.
      # Инвариант «монтируется ли 30-management-path-prefix.conf этому брокеру» ⇔
      # «есть ли /rabbitmq в RABBITMQ_MGMT_BASE_URL» проверяется тестом
      # RabbitMqMgmtPathPrefixWiringGuardTest (zorrobpm-app), а не только комментарием.
      RABBITMQ_MGMT_BASE_URL: ${RABBITMQ_MGMT_BASE_URL:-http://rabbitmq:15672/rabbitmq}
      # WO-SEC-86: кому приложение доверяет заголовок X-Real-IP для per-IP
      # rate-limit бакетов (иначе все «per-IP» бюджеты — один общий бакет на всю
      # инсталляцию: TCP-пир app всегда frontend-контейнер). Класс WO-INT-6: var
      # из host-.env доходит до контейнера ТОЛЬКО если перечислена здесь явно.
      # Дефолт 172.16.0.0/12 — стандартные пулы Docker bridge (IP frontend оттуда;
      # сверка: docker network inspect zorrobpm_zorrobpm). Явный subnet/ipam-пин
      # в compose НЕ ставить — прод-инцидент 2026-09-14 (Pool overlaps). Если
      # daemon использует кастомные пулы — задать в .env точный CIDR/IP frontend.
      ZORROBPM_RATE_LIMIT_TRUSTED_PROXIES: ${ZORROBPM_RATE_LIMIT_TRUSTED_PROXIES:-172.16.0.0/12}
      APP_FILES_DIR: /app/files
      # REQUIRED in prod: strong secret, else the app refuses to start (WO-SEC-9). Generate: openssl rand -base64 48
      ZORROBPM_JWT_SECRET: ${ZORROBPM_JWT_SECRET:?ZORROBPM_JWT_SECRET must be set in .env}
      # WO-SEC-57: optional CSV of previously active JWT secrets, accepted for verification only.
      # Used during rotation: put the OLD secret here + the NEW one in ZORROBPM_JWT_SECRET, restart,
      # wait one access-token TTL, then remove the old one. See governance/runbooks/jwt-key-rotation.md.
      ZORROBPM_JWT_LEGACY_SECRETS: ${ZORROBPM_JWT_LEGACY_SECRETS:-}
      # REQUIRED in prod: secure admin password, else the app refuses to start (WO-SEC-14 fail-fast).
      # Must NOT be "admin". Generate a strong one.
      ZORROBPM_DEFAULT_ADMIN_PASSWORD: ${ZORROBPM_DEFAULT_ADMIN_PASSWORD:?ZORROBPM_DEFAULT_ADMIN_PASSWORD must be set in .env}
      # Browser origins allowed for the SPA (same-origin via nginx doesn't need this, but set for safety)
      ZORROBPM_CORS_ORIGINS: ${ZORROBPM_CORS_ORIGINS:-https://test-zbpm.telecom.kz}
      # WO-INT-5: mail transport — values in .env on host, never in repo
      ZORROBPM_MAIL_HOST: ${ZORROBPM_MAIL_HOST:-}
      ZORROBPM_MAIL_PORT: ${ZORROBPM_MAIL_PORT:-}
      ZORROBPM_MAIL_USERNAME: ${ZORROBPM_MAIL_USERNAME:-}
      ZORROBPM_MAIL_PASSWORD: ${ZORROBPM_MAIL_PASSWORD:-}
      ZORROBPM_MAIL_FROM: ${ZORROBPM_MAIL_FROM:-}
      ZORROBPM_MAIL_ALLOWED_RECIPIENTS: ${ZORROBPM_MAIL_ALLOWED_RECIPIENTS:-}
      # WO-INT-6: missing from the original service definition — .env having the var is not enough,
      # compose only forwards vars explicitly listed here into the container.
      ZORROBPM_MAIL_PASSWORD_ENCRYPTION_KEY: ${ZORROBPM_MAIL_PASSWORD_ENCRYPTION_KEY:-}
      # WO-ACL-18: invitation / password-reset links + rate-limit tuning.
      ZORROBPM_MAIL_LINK_BASE_URL: ${ZORROBPM_MAIL_LINK_BASE_URL:-http://localhost:5173}
      ZORROBPM_INVITATION_TTL_HOURS: ${ZORROBPM_INVITATION_TTL_HOURS:-24}
      ZORROBPM_RESET_TTL_HOURS: ${ZORROBPM_RESET_TTL_HOURS:-24}
      ZORROBPM_RESET_EMAIL_CAPACITY: ${ZORROBPM_RESET_EMAIL_CAPACITY:-5}
      ZORROBPM_RESET_EMAIL_WINDOW: ${ZORROBPM_RESET_EMAIL_WINDOW:-3600}
      ZORROBPM_RESET_IP_CAPACITY: ${ZORROBPM_RESET_IP_CAPACITY:-20}
      ZORROBPM_RESET_IP_WINDOW: ${ZORROBPM_RESET_IP_WINDOW:-3600}
      # WO-REL-27: stuck service-task watchdog (defaults mirror
      # zorrobpm-engine/src/main/resources/zorrobpm-engine.properties).
      SERVICETASK_DISPATCH_TIMEOUT: ${SERVICETASK_DISPATCH_TIMEOUT:-15m}
      SERVICETASK_WATCHDOG_INTERVAL_MS: ${SERVICETASK_WATCHDOG_INTERVAL_MS:-60000}
      SERVICETASK_WATCHDOG_BATCH_SIZE: ${SERVICETASK_WATCHDOG_BATCH_SIZE:-100}
      # WO-REL-46: FEEL/script pool size (default 8 in application.properties).
      # Listed here so a host .env value reaches the container (WO-INT-6 class).
      SCRIPT_POOL_SIZE: ${SCRIPT_POOL_SIZE:-8}
      # WO-ENG-24: admission control для того же пула.
      SCRIPT_QUEUE_CAPACITY: ${SCRIPT_QUEUE_CAPACITY:-10}
      SCRIPT_QUEUE_WAIT_SECONDS: ${SCRIPT_QUEUE_WAIT_SECONDS:-5}
      # WO-PERF-8: retention chunk + outbox chunk/gauge-sampling cadence (see
      # zorrobpm-engine.properties).
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-25}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_METRICS_SAMPLE_EVERY: ${OUTBOX_METRICS_SAMPLE_EVERY:-30}
      # WO-ENG-30: strict io-mapping compat flag (default false in
      # zorrobpm-engine.properties).
      IO_MAPPING_STRICT_MISSING: ${IO_MAPPING_STRICT_MISSING:-false}
      # WO-CFG-1: эти четыре ручки не были объявлены в compose ВООБЩЕ, поэтому даже
      # после починки импорта оператор не мог до них дотянуться (в docker-compose.yml
      # НЕТ env_file — в контейнер попадает только перечисленное ниже). Умолчания
      # совпадают с zorrobpm-engine.properties; ModuleConfigImportGuardTest (Guard D)
      # сверяет их между собой, так что разъехаться они не могут.
      SCRIPT_TIMEOUT_SECONDS: ${SCRIPT_TIMEOUT_SECONDS:-10}
      RETENTION_TTL_DAYS: ${RETENTION_TTL_DAYS:-0}
      RETENTION_POLL_INTERVAL_MS: ${RETENTION_POLL_INTERVAL_MS:-3600000}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Almaty}
      # WO-C8-36 (H-1): phased-штамп вызова в теле задания. В нашем стеке engine
      # и http-connector released together, все воркеры этого релиза новые —
      # поэтому true (прод-дефолт в application.properties остаётся false для
      # внешних воркеров: порядок «сначала воркеры, потом флаг» именно из-за них).
      ZORROBPM_ENGINE_DISPATCH_PHASE_STAMPING: ${ZORROBPM_ENGINE_DISPATCH_PHASE_STAMPING:-true}
      # WO-C8-36 (H-2): окно жизни durable-маркера дедупа отправок результата.
      # Раунд 4, F-7: имя переменной — ТОЧНАЯ relaxed-binding форма ключа
      # `zorrobpm.engine.completion-dedup.ttl-seconds`, т.е. с префиксом ENGINE_.
      # Прежнее ZORROBPM_COMPLETION_DEDUP_TTL_SECONDS синонимом ключа НЕ было:
      # в fat-jar BOOT-INF/classes/application.properties (этот стек) перекрывает
      # engine-файл, так что placeholder из engine-свойств не разрешается ВООБЩЕ,
      # и связь ручки с .env жила только на этом имени. Оператор ставил значение —
      # контейнер стартовал с дефолтом 3600, зажим F-3 был недостижим, WARN молчал.
      # Доказано: engine-тест C836ComposeEnvBindingTest берёт имя ОТСЮДА.
      ZORROBPM_ENGINE_COMPLETION_DEDUP_TTL_SECONDS: ${ZORROBPM_ENGINE_COMPLETION_DEDUP_TTL_SECONDS:-3600}
      # WO-AUDIT-8 (A-NEW4-10): размер retry-lane SSE-моста. Имя — точная
      # relaxed-binding форма ключа `zorrobpm.sse.retry-lane-size` (прецедент
      # C8-36 F-7: без префикса переменная не разрешается). Дефолт 1 = как
      # хардкод до WO; связка compose → env → бин — тестом ниже в этом же WO.
      ZORROBPM_SSE_RETRY_LANE_SIZE: ${ZORROBPM_SSE_RETRY_LANE_SIZE:-1}
      # WO-ENG-31 Фаза 2: HTTP-коннектор (дефолты fail-closed: выключен + deny-all;
      # пусто = дефолт свойства; compose пробрасывает явно — WO-INT-6 класс).
      ZORROBPM_HTTP_CONNECTOR_ENABLED: ${ZORROBPM_HTTP_CONNECTOR_ENABLED:-false}
      ZORROBPM_HTTP_CONNECTOR_ALLOWED_HOSTS: ${ZORROBPM_HTTP_CONNECTOR_ALLOWED_HOSTS:-}
      ZORROBPM_HTTP_CONNECTOR_ALLOW_PRIVATE_NETWORKS: ${ZORROBPM_HTTP_CONNECTOR_ALLOW_PRIVATE_NETWORKS:-false}
      ZORROBPM_HTTP_CONNECTOR_MAX_RESPONSE_BYTES: ${ZORROBPM_HTTP_CONNECTOR_MAX_RESPONSE_BYTES:-1048576}
      ZORROBPM_HTTP_CONNECTOR_CONNECTION_TIMEOUT: ${ZORROBPM_HTTP_CONNECTOR_CONNECTION_TIMEOUT:-20}
      ZORROBPM_HTTP_CONNECTOR_READ_TIMEOUT: ${ZORROBPM_HTTP_CONNECTOR_READ_TIMEOUT:-20}
      ZORROBPM_HTTP_CONNECTOR_MAX_REDIRECTS: ${ZORROBPM_HTTP_CONNECTOR_MAX_REDIRECTS:-0}
      ZORROBPM_HTTP_CONNECTOR_SECRETS_JSON: ${ZORROBPM_HTTP_CONNECTOR_SECRETS_JSON:-}
      # NEW5-07: секреты коннектора (authType != none) — одним JSON-объектом:
      # ZORROBPM_HTTP_CONNECTOR_SECRETS_JSON='{"svc":{"type":"bearer","token":"..."}}'.
      # Пусто = секретов нет (authType=none). Подробности — docs/guides/http-connector.md
      TZ: Asia/Almaty
    volumes:
      - app-files:/app/files
    ports:
      - "${APP_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m
    networks:
      - zorrobpm

  # Vue SPA served by nginx; also reverse-proxies /api -> app:8080 inside the network.
  # The external production proxy (https://test-zbpm.telecom.kz) forwards to this service.
  frontend:
    build:
      context: ./zorrobpm-frontend
      dockerfile: Dockerfile
    image: zorrobpm-frontend:${FRONTEND_TAG:-latest}
    environment:
      TZ: Asia/Almaty
    container_name: zorrobpm-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
        reservations:
          memory: 32m
    networks:
      - zorrobpm

volumes:
  postgres-data:
  rabbitmq-data:
  app-files:

networks:
  zorrobpm:
    driver: bridge
