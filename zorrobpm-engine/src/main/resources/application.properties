spring.application.name=zorrobpm-engine

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:10001/zorrobpm-db}
spring.datasource.username=${DB_USERNAME:zorrodev}
spring.datasource.password=${DB_PASSWORD:zorrodev}

app.filesDir=${APP_FILES_DIR:${user.home}/.zorrobpm/files}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USERNAME:zorrodev}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:zorrodev}
spring.rabbitmq.port=${RABBITMQ_PORT:10004}

# Retention: disabled by default (ttl-days=0). Enable by setting to a positive value.
zorrobpm.engine.retention.ttl-days=${RETENTION_TTL_DAYS:0}
zorrobpm.engine.retention.poll-interval-ms=${RETENTION_POLL_INTERVAL_MS:3600000}
zorrobpm.engine.retention.batch-size=${RETENTION_BATCH_SIZE:100}
