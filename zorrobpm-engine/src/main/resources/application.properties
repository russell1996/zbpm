spring.application.name=zorrobpm-engine

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:10001/zorrobpm-db}
spring.datasource.username=${DB_USERNAME:zorrodev}
spring.datasource.password=${DB_PASSWORD:zorrodev}

app.filesDir=${APP_FILES_DIR:${user.home}/.zorrobpm/files}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USERNAME:zorrodev}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:zorrodev}
spring.rabbitmq.port=${RABBITMQ_PORT:10004}

# Retention: disabled by default (ttl-days=0). Enable by setting to a positive value.
zorrobpm.engine.retention.ttl-days=${RETENTION_TTL_DAYS:0}
zorrobpm.engine.retention.poll-interval-ms=${RETENTION_POLL_INTERVAL_MS:3600000}
zorrobpm.engine.retention.batch-size=${RETENTION_BATCH_SIZE:25}

# Outbox poller: batch per 2s tick + gauge sampling cadence (WO-PERF-8: smaller
# chunks shorten the SKIP LOCKED transaction; COUNT(*) gauges sampled every
# Nth tick instead of every tick).
zorrobpm.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
zorrobpm.outbox.metrics-sample-every=${OUTBOX_METRICS_SAMPLE_EVERY:30}

# Script execution timeout (seconds). Scripts exceeding this are killed.
zorrobpm.engine.script-timeout-seconds=${SCRIPT_TIMEOUT_SECONDS:10}

# WO-REL-46: FEEL/script pool size (concurrent evaluations). Raises the bar for
# non-cooperative stuck workers: each pins one slot, and a full outage needs
# poolSize simultaneous hangs instead of 2. Pool + queue stay bounded (fail-fast
# reject past that); saturation is visible via zbpm.script.pool.active/size.
zorrobpm.engine.script-pool-size=${SCRIPT_POOL_SIZE:8}

# WO-ENG-24: admission control для того же пула. queue-capacity — мест в очереди
# (дефолт 10 — прежний хардкод); queue-wait-seconds — сколько сабмит ждёт
# освобождения при полном пуле+очереди, прежде чем сбросить нагрузку как
# временную перегрузку (503 + Retry-After). Итоговая вместимость pool + queue =
# 18: порог отказов в замере аудита — именно число одновременных вызывающих
# сверх неё (timer до 8, Rabbit 3–5, Tomcat до 200 — в пике реально больше 18
# даже на дешёвых выражениях), поэтому мгновенный отказ при полном пуле
# сбрасывал целые операции на переходном всплеске.
zorrobpm.engine.script-queue-capacity=${SCRIPT_QUEUE_CAPACITY:10}
zorrobpm.engine.script-queue-wait-seconds=${SCRIPT_QUEUE_WAIT_SECONDS:5}

# WO-ENG-4: Business timezone for interpreting zone-naive FEEL date/time values.
# FEEL expressions like =dueDate (LocalDateTime without zone) are converted to Instant
# in this timezone. Default: Asia/Almaty (confirmed by team in commit 063c685).
zorrobpm.business-timezone=${BUSINESS_TIMEZONE:Asia/Almaty}

# WO-ACL-18: invitation / password-reset one-time links
zorrobpm.mail.link-base-url=${ZORROBPM_MAIL_LINK_BASE_URL:http://localhost:5173}
zorrobpm.security.invitation-ttl-hours=${ZORROBPM_INVITATION_TTL_HOURS:24}
zorrobpm.security.reset-ttl-hours=${ZORROBPM_RESET_TTL_HOURS:24}

# WO-ACL-18 criterion 13: rate limit on password-reset REQUESTS (per email AND per client IP)
zorrobpm.security.rate-limit.reset-email-capacity=${ZORROBPM_RESET_EMAIL_CAPACITY:5}
zorrobpm.security.rate-limit.reset-email-window-seconds=${ZORROBPM_RESET_EMAIL_WINDOW:3600}
zorrobpm.security.rate-limit.reset-ip-capacity=${ZORROBPM_RESET_IP_CAPACITY:20}
zorrobpm.security.rate-limit.reset-ip-window-seconds=${ZORROBPM_RESET_IP_WINDOW:3600}
# WO-REL-27: stuck service-task watchdog
zorrobpm.servicetask.dispatch-timeout=${SERVICETASK_DISPATCH_TIMEOUT:15m}
zorrobpm.servicetask.watchdog-interval-ms=${SERVICETASK_WATCHDOG_INTERVAL_MS:60000}
zorrobpm.servicetask.watchdog-batch-size=${SERVICETASK_WATCHDOG_BATCH_SIZE:100}
