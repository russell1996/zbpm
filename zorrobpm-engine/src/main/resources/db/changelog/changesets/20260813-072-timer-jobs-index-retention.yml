databaseChangeLog:
  - logicalFilePath: 20260813-072
  - changeSet:
      id: 20260813-072-index
      author: zorrodev
      comment: WO-PERF-3 — index for the boundary timer re-arm query (activity_id, boundary_element_id, fired, created_at DESC)
      changes:
        - createIndex:
            tableName: timer_jobs
            indexName: idx_timer_jobs__activity_boundary_fired_created
            columns:
              - column:
                  name: activity_id
              - column:
                  name: boundary_element_id
              - column:
                  name: fired
              - column:
                  name: created_at
                  descending: true
      rollback:
        - dropIndex:
            tableName: timer_jobs
            indexName: idx_timer_jobs__activity_boundary_fired_created

  - changeSet:
      id: 20260813-072-pg-backfill
      author: zorrodev
      dbms: postgresql
      comment: WO-PERF-3 — PostgreSQL backfill for historical boundary jobs with NULL process_instance_id.
      changes:
        - sql:
            sql: >-
              UPDATE timer_jobs SET process_instance_id = (
                SELECT pi.id FROM process_instances pi
                JOIN activities a ON a.process_instance_id = pi.id
                WHERE a.id = timer_jobs.activity_id
                LIMIT 1
              )
              WHERE process_instance_id IS NULL
              AND boundary_element_id IS NOT NULL
      rollback:
        - sql:
            sql: >-
              UPDATE timer_jobs SET process_instance_id = NULL
              WHERE boundary_element_id IS NOT NULL

  - changeSet:
      id: 20260813-072-h2-backfill
      author: zorrodev
      dbms: h2
      comment: WO-PERF-3 — H2 backfill for historical boundary jobs with NULL process_instance_id.
      changes:
        - sql:
            sql: >-
              UPDATE timer_jobs SET process_instance_id = (
                SELECT a.process_instance_id FROM activities a
                WHERE a.id = timer_jobs.activity_id
                LIMIT 1
              )
              WHERE process_instance_id IS NULL
              AND boundary_element_id IS NOT NULL
      rollback:
        - sql:
            sql: >-
              UPDATE timer_jobs SET process_instance_id = NULL
              WHERE boundary_element_id IS NOT NULL