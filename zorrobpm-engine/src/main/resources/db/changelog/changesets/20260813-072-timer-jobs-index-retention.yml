databaseChangeLog:
  - logicalFilePath: 20260813-072
  - changeSet:
      id: 20260813-072-index
      author: zorrodev
      comment: WO-PERF-3 — index for the boundary timer re-arm query (activity_id, boundary_element_id, fired, created_at DESC)
      changes:
        - createIndex:
            tableName: timer_jobs
            indexName: idx_timer_jobs__activity_boundary_fired_created
            columns:
              - column:
                  name: activity_id
              - column:
                  name: boundary_element_id
              - column:
                  name: fired
              - column:
                  name: created_at
                  descending: true
      rollback:
        - dropIndex:
            tableName: timer_jobs
            indexName: idx_timer_jobs__activity_boundary_fired_created

  - changeSet:
      id: 20260813-072-pg-cleanup
      author: zorrodev
      dbms: postgresql
      comment: >-
        WO-PERF-3 — Delete orphaned historical boundary jobs with NULL process_instance_id.
        These are fired boundary jobs whose processInstanceId was never set (pre-fix) and whose
        process_instances were already purged by retention. They cannot be re-armed (fired=true)
        and accumulate forever. The backfill-through-activities approach was ruled out because
        retention deletes activities along with instances, so the rows it targets are already gone.
      changes:
        - sql:
            sql: >-
              DELETE FROM timer_jobs
              WHERE process_instance_id IS NULL
              AND boundary_element_id IS NOT NULL
              AND fired = true
      rollback:
        - sql:
            sql: >-
              -- Rollback not possible for DELETE; documented as irreversible cleanup.

  - changeSet:
      id: 20260813-072-h2-cleanup
      author: zorrodev
      dbms: h2
      comment: >-
        WO-PERF-3 — Delete orphaned historical boundary jobs with NULL process_instance_id (H2).
      changes:
        - sql:
            sql: >-
              DELETE FROM timer_jobs
              WHERE process_instance_id IS NULL
              AND boundary_element_id IS NOT NULL
              AND fired = true
      rollback:
        - sql:
            sql: >-
              -- Rollback not possible for DELETE; documented as irreversible cleanup.
