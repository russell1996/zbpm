databaseChangeLog:
  - changeSet:
      id: 20260712-051-scoped-api-keys
      author: mimo
      changes:
        # ADR-2: One API key per user + per-process grants
        # Replaces service_account / service_account_permission (MT-4)

        - createTable:
            tableName: api_key
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_user_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: key_hash
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: prefix
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_used_at
                  type: TIMESTAMP
              - column:
                  name: expires_at
                  type: TIMESTAMP
              - column:
                  name: revoked_at
                  type: TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: api_key
            baseColumnNames: owner_user_id
            referencedTableName: ui_users
            referencedColumnNames: id

        - createTable:
            tableName: api_key_grant
            columns:
              - column:
                  name: api_key_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: process_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: permissions
                  type: VARCHAR(512)
                  constraints:
                    nullable: true
              - column:
                  name: is_full
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: api_key_grant
            columnNames: api_key_id, process_id

        - addForeignKeyConstraint:
            baseTableName: api_key_grant
            baseColumnNames: api_key_id
            referencedTableName: api_key
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: api_key_grant
            baseColumnNames: process_id
            referencedTableName: process
            referencedColumnNames: id
