databaseChangeLog:
  - logicalFilePath: 20260618-021
  - changeSet:
      id: 20260618-021
      author: zorrodev
      changes:
        - createTable:
            tableName: message_subscriptions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_message_subscriptions
              - column:
                  name: process_instance_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: activity_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: message_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: consumed
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime with timezone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: message_subscriptions
            indexName: idx_message_subscriptions__lookup
            columns:
              - column:
                  name: consumed
              - column:
                  name: message_name
              - column:
                  name: process_instance_id
