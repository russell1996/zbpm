databaseChangeLog:
  - logicalFilePath: 20260827-080
  - changeSet:
      id: 20260827-080
      author: zorrodev
      changes:
        - createTable:
            tableName: mail_settings
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_mail_settings
              - column:
                  name: host
                  type: varchar(255)
              - column:
                  name: port
                  type: integer
              - column:
                  name: username
                  type: varchar(255)
              - column:
                  name: password_encrypted
                  type: varchar(1024)
              - column:
                  name: sender
                  type: varchar(255)
              - column:
                  name: allowed_recipients
                  type: text
              - column:
                  name: created_at
                  type: datetime with timezone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: datetime with timezone
