databaseChangeLog:
  - logicalFilePath: 20260827-081
  - changeSet:
      id: 20260827-081
      author: zorrodev
      changes:
        - createTable:
            tableName: password_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_password_tokens
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: expires_at
                  type: datetime with timezone
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: datetime with timezone
              - column:
                  name: created_at
                  type: datetime with timezone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: password_tokens
            indexName: idx_password_tokens_hash
            columns:
              - column:
                  name: token_hash
        - createIndex:
            tableName: password_tokens
            indexName: idx_password_tokens_user_type
            columns:
              - column:
                  name: user_id
              - column:
                  name: type
