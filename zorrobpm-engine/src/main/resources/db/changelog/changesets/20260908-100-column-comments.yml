databaseChangeLog:
  - logicalFilePath: 20260908-100
  - changeSet:
      id: 20260908-100
      author: zorrodev
      changes:
        - setColumnRemarks:
            tableName: activities
            columnName: id
            remarks: 'Первичный ключ runtime-активности; тот же id переиспользуют строки service_tasks и user_tasks'
        - setColumnRemarks:
            tableName: activities
            columnName: process_instance_id
            remarks: 'Ссылка на process_instances.id — экземпляр, в котором исполняется активность'
        - setColumnRemarks:
            tableName: activities
            columnName: token
            remarks: 'Ссылка на tokens.id — токен исполнения, которому принадлежит активность (имя колонки историческое, это не значение токена)'
        - setColumnRemarks:
            tableName: activities
            columnName: bpmn_element_id
            remarks: 'Id элемента в BPMN-модели — какая нода процесса исполняется этой активностью'
        - setColumnRemarks:
            tableName: activities
            columnName: created_at
            remarks: 'Момент создания активности движком'
        - setColumnRemarks:
            tableName: activities
            columnName: completed_at
            remarks: 'Момент завершения или отмены активности; null — активность ещё открыта (состояние ERROR паркуется без этой метки)'
        - setColumnRemarks:
            tableName: activities
            columnName: type
            remarks: 'Тип BPMN-элемента строкой из BpmnElementType (USER_TASK, SERVICE_TASK, шлюзы, события и прочие)'
        - setColumnRemarks:
            tableName: activities
            columnName: status
            remarks: 'Стадия жизненного цикла строкой из ActivityStatus: CREATED, IN_PROGRESS, ERROR, COMPLETED, CANCELLED'
        - setColumnRemarks:
            tableName: api_key
            columnName: id
            remarks: 'Первичный ключ сервисного API-ключа'
        - setColumnRemarks:
            tableName: api_key
            columnName: owner_user_id
            remarks: 'Владелец ключа: id пользователя из ui_users, чьи права процесса пересекаются с грантами ключа'
        - setColumnRemarks:
            tableName: api_key
            columnName: key_hash
            remarks: 'Хэш секретной части ключа для проверки запросов; сам секрет нигде не хранится'
        - setColumnRemarks:
            tableName: api_key
            columnName: prefix
            remarks: 'Видимый префикс ключа для опознания в списке без раскрытия секрета'
        - setColumnRemarks:
            tableName: api_key
            columnName: created_at
            remarks: 'Момент выпуска API-ключа'
        - setColumnRemarks:
            tableName: api_key
            columnName: last_used_at
            remarks: 'Момент последнего использования ключа; пусто, если ключ ещё не применялся'
        - setColumnRemarks:
            tableName: api_key
            columnName: expires_at
            remarks: 'Срок действия ключа; после него запросы с ключом отклоняются'
        - setColumnRemarks:
            tableName: api_key
            columnName: revoked_at
            remarks: 'Момент досрочного отзыва ключа; пусто, пока ключ действует'
        - setColumnRemarks:
            tableName: api_key_grant
            columnName: api_key_id
            remarks: 'Часть составного ключа: id ключа из api_key, которому выдан грант'
        - setColumnRemarks:
            tableName: api_key_grant
            columnName: process_id
            remarks: 'Часть составного ключа: id записи реестра процессов (process.id), к которой относится грант'
        - setColumnRemarks:
            tableName: api_key_grant
            columnName: permissions
            remarks: 'Список действий через запятую, разрешённых ключом на этом процессе; пусто при полном доступе'
        - setColumnRemarks:
            tableName: api_key_grant
            columnName: is_full
            remarks: 'Флаг полного доступа ключа к процессу без перечисления отдельных действий'
        - setColumnRemarks:
            tableName: audit_log
            columnName: id
            remarks: 'Первичный ключ записи журнала аудита'
        - setColumnRemarks:
            tableName: audit_log
            columnName: principal_type
            remarks: 'Тип инициатора: USER для человека, API_KEY для сервисного ключа'
        - setColumnRemarks:
            tableName: audit_log
            columnName: principal_id
            remarks: 'Идентификатор инициатора: id пользователя из ui_users либо id ключа из api_key'
        - setColumnRemarks:
            tableName: audit_log
            columnName: owner_user_id
            remarks: 'Пользователь, чьи права действовали: сам пользователь либо владелец ключа из ui_users'
        - setColumnRemarks:
            tableName: audit_log
            columnName: action
            remarks: 'Код зафиксированного действия, например MAIL_SETTINGS_UPDATE'
        - setColumnRemarks:
            tableName: audit_log
            columnName: process_key
            remarks: 'Ключ процесса из реестра (definition_key), к которому относится действие; пусто для глобальных действий'
        - setColumnRemarks:
            tableName: audit_log
            columnName: target_id
            remarks: 'Объект действия: обычно перечисление изменённых полей или id затронутой сущности'
        - setColumnRemarks:
            tableName: audit_log
            columnName: at
            remarks: 'Момент фиксации события в журнале'
        - setColumnRemarks:
            tableName: bpmn
            columnName: id
            remarks: 'Первичный ключ модели BPMN; совпадает с process_definitions.id той версии, чью модель хранит строка'
        - setColumnRemarks:
            tableName: bpmn
            columnName: bpmn
            remarks: 'Исходный XML модели BPMN для версии определения'
        - setColumnRemarks:
            tableName: deployments
            columnName: id
            remarks: 'Первичный ключ пачки выкладки; проставляется как deployment_id на все строки, выложенные одним запросом'
        - setColumnRemarks:
            tableName: deployments
            columnName: created_at
            remarks: 'Момент создания пачки выкладки'
        - setColumnRemarks:
            tableName: dmn_definitions
            columnName: decision_id
            remarks: 'Бизнес-ключ DMN-решения из DMN XML; в паре с version однозначно задаёт версию решения'
        - setColumnRemarks:
            tableName: dmn_definitions
            columnName: dmn
            remarks: 'Исходный XML DMN-решения для этой версии'
        - setColumnRemarks:
            tableName: dmn_definitions
            columnName: created_at
            remarks: 'Момент создания строки версии DMN-решения'
        - setColumnRemarks:
            tableName: dmn_definitions
            columnName: id
            remarks: 'Суррогатный первичный ключ строки версии DMN-решения'
        - setColumnRemarks:
            tableName: dmn_definitions
            columnName: version
            remarks: 'Номер версии внутри одного решения; при вычислении используется старшая версия'
        - setColumnRemarks:
            tableName: dmn_definitions
            columnName: process_definition_id
            remarks: 'Определение из process_definitions.id, вместе с которым выложен DMN; привязка области решения к выложившему его процессу'
        - setColumnRemarks:
            tableName: element_artifact_binding
            columnName: id
            remarks: 'Первичный ключ привязки элемента к артефакту'
        - setColumnRemarks:
            tableName: element_artifact_binding
            columnName: process_definition_id
            remarks: 'Версия определения из process_definitions, которой принадлежит привязанный элемент'
        - setColumnRemarks:
            tableName: element_artifact_binding
            columnName: process_definition_version
            remarks: 'Номер версии определения, продублированный для переноса привязок на новую версию при деплое'
        - setColumnRemarks:
            tableName: element_artifact_binding
            columnName: element_id
            remarks: 'Id элемента BPMN, обычно пользовательской задачи с вложенной формой'
        - setColumnRemarks:
            tableName: element_artifact_binding
            columnName: artifact_key
            remarks: 'Ключ артефакта формы из таблицы form'
        - setColumnRemarks:
            tableName: element_artifact_binding
            columnName: artifact_version
            remarks: 'Версия артефакта формы, закреплённая за элементом на момент деплоя'
        - setColumnRemarks:
            tableName: element_artifact_binding
            columnName: created_at
            remarks: 'Момент создания привязки при деплое'
        - setColumnRemarks:
            tableName: element_listener_phase
            columnName: process_instance_id
            remarks: 'Ссылка на process_instances.id — экземпляр, чей токен приостановлен на время фазы listener-ов'
        - setColumnRemarks:
            tableName: element_listener_phase
            columnName: token_id
            remarks: 'Ссылка на tokens.id — токен, чьё движение приостановлено, пока идут start-listener-ы элемента'
        - setColumnRemarks:
            tableName: element_listener_phase
            columnName: bpmn_element_id
            remarks: 'Id элемента в BPMN-модели (шлюз или событие), чьи start-listener-ы сейчас исполняются'
        - setColumnRemarks:
            tableName: element_listener_phase
            columnName: created_at
            remarks: 'Момент открытия фазы listener-ов'
        - setColumnRemarks:
            tableName: events
            columnName: sequence
            remarks: 'Монотонный первичный ключ append-only ленты событий; курсор для постраничного чтения'
        - setColumnRemarks:
            tableName: events
            columnName: id
            remarks: 'Бизнес-идентификатор события для дедупликации потребителем при at-least-once доставке'
        - setColumnRemarks:
            tableName: events
            columnName: type
            remarks: 'Тип события строкой из DomainEventType (например process-instance.started, user-task.created, incident.raised)'
        - setColumnRemarks:
            tableName: events
            columnName: version
            remarks: 'Версия схемы события; эмиттер всегда пишет 1'
        - setColumnRemarks:
            tableName: events
            columnName: occurred_at
            remarks: 'Момент наступления доменного события'
        - setColumnRemarks:
            tableName: events
            columnName: process_definition_id
            remarks: 'Ссылка на process_definitions.id — определение процесса, в котором произошло событие'
        - setColumnRemarks:
            tableName: events
            columnName: process_instance_id
            remarks: 'Ссылка на process_instances.id — экземпляр, в котором произошло событие'
        - setColumnRemarks:
            tableName: events
            columnName: element_id
            remarks: 'Id BPMN-элемента — источника события; null для событий уровня экземпляра'
        - setColumnRemarks:
            tableName: events
            columnName: owner_scope
            remarks: 'Область владельца для authz-фильтрации — строковый processDefinitionId'
        - setColumnRemarks:
            tableName: events
            columnName: data
            remarks: 'JSON-тело события со строково-санитизированными значениями; сериализация гарантированно не падает'
        - setColumnRemarks:
            tableName: form
            columnName: id
            remarks: 'Суррогатный первичный ключ строки версии формы'
        - setColumnRemarks:
            tableName: form
            columnName: form_key
            remarks: 'Адресный ключ формы; в паре с version однозначно задаёт версию'
        - setColumnRemarks:
            tableName: form
            columnName: version
            remarks: 'Номер версии внутри одного ключа формы; уникален в паре с form_key'
        - setColumnRemarks:
            tableName: form
            columnName: schema_json
            remarks: 'JSON-схема формы (поля, вёрстка и вложенные id и versionTag)'
        - setColumnRemarks:
            tableName: form
            columnName: created_at
            remarks: 'Момент создания строки версии формы'
        - setColumnRemarks:
            tableName: form
            columnName: kind
            remarks: 'Разновидность артефакта: FORM_JS — форма пользовательского шага, VARIABLE_SCHEMA — схема переменных'
        - setColumnRemarks:
            tableName: incidents
            columnName: id
            remarks: 'Первичный ключ инцидента — зафиксированного сбоя исполнения'
        - setColumnRemarks:
            tableName: incidents
            columnName: message
            remarks: 'Текст причины сбоя'
        - setColumnRemarks:
            tableName: incidents
            columnName: created_at
            remarks: 'Момент поднятия инцидента движком'
        - setColumnRemarks:
            tableName: incidents
            columnName: completed_at
            remarks: 'Момент разрешения инцидента; null — инцидент открыт'
        - setColumnRemarks:
            tableName: incidents
            columnName: activity_id
            remarks: 'Ссылка на activities.id — активность, на которой поднят инцидент'
        - setColumnRemarks:
            tableName: mail_settings
            columnName: id
            remarks: 'Первичный ключ; таблица однострочная и всегда использует фиксированный id'
        - setColumnRemarks:
            tableName: mail_settings
            columnName: host
            remarks: 'Имя SMTP-сервера для исходящей почты'
        - setColumnRemarks:
            tableName: mail_settings
            columnName: port
            remarks: 'Порт SMTP-сервера'
        - setColumnRemarks:
            tableName: mail_settings
            columnName: username
            remarks: 'Логин для аутентификации на SMTP-сервере'
        - setColumnRemarks:
            tableName: mail_settings
            columnName: password_encrypted
            remarks: 'Зашифрованный пароль SMTP; расшифровка требует ключ ZORROBPM_MAIL_PASSWORD_ENCRYPTION_KEY'
        - setColumnRemarks:
            tableName: mail_settings
            columnName: sender
            remarks: 'Адрес отправителя, подставляемый в поле From исходящих писем'
        - setColumnRemarks:
            tableName: mail_settings
            columnName: allowed_recipients
            remarks: 'Список разрешённых получателей через запятую; пустой список означает отправку без ограничений'
        - setColumnRemarks:
            tableName: mail_settings
            columnName: created_at
            remarks: 'Момент первого сохранения почтовых настроек'
        - setColumnRemarks:
            tableName: mail_settings
            columnName: updated_at
            remarks: 'Момент последнего изменения почтовых настроек'
        - setColumnRemarks:
            tableName: message_start_subscriptions
            columnName: id
            remarks: 'Первичный ключ стартовой подписки на сообщение'
        - setColumnRemarks:
            tableName: message_start_subscriptions
            columnName: process_key
            remarks: 'Ключ процесса из реестра, новая версия которого вытесняет эту подписку при деплое'
        - setColumnRemarks:
            tableName: message_start_subscriptions
            columnName: process_definition_id
            remarks: 'Версия определения из process_definitions, чей экземпляр стартует при получении сообщения'
        - setColumnRemarks:
            tableName: message_start_subscriptions
            columnName: element_id
            remarks: 'Id стартового элемента BPMN, с которого начинается новый экземпляр'
        - setColumnRemarks:
            tableName: message_start_subscriptions
            columnName: message_name
            remarks: 'Имя сообщения, получение которого без целевого экземпляра стартует новый процесс'
        - setColumnRemarks:
            tableName: message_start_subscriptions
            columnName: created_at
            remarks: 'Момент регистрации стартовой подписки при деплое'
        - setColumnRemarks:
            tableName: message_subscriptions
            columnName: id
            remarks: 'Первичный ключ подписки на сообщение'
        - setColumnRemarks:
            tableName: message_subscriptions
            columnName: process_instance_id
            remarks: 'Экземпляр из process_instances, чей токен ожидает сообщение'
        - setColumnRemarks:
            tableName: message_subscriptions
            columnName: activity_id
            remarks: 'Активность из activities, которую нужно сигнализировать при получении сообщения'
        - setColumnRemarks:
            tableName: message_subscriptions
            columnName: message_name
            remarks: 'Имя сообщения, которое коррелируется с этой подпиской'
        - setColumnRemarks:
            tableName: message_subscriptions
            columnName: consumed
            remarks: 'Флаг поглощения: обработанная подписка больше не участвует в корреляции'
        - setColumnRemarks:
            tableName: message_subscriptions
            columnName: created_at
            remarks: 'Момент создания подписки на сообщение'
        - setColumnRemarks:
            tableName: message_subscriptions
            columnName: boundary_element_id
            remarks: 'Граничное message-событие для срабатывания вместо обычной точки ожидания; пусто для обычного перехвата'
        - setColumnRemarks:
            tableName: message_subscriptions
            columnName: correlation_key
            remarks: 'Вычисленное значение ключа корреляции; пусто, когда сообщение ищется только по имени'
        - setColumnRemarks:
            tableName: message_subscriptions
            columnName: event_subprocess_id
            remarks: 'Подпроцесс по событию, запускаемый сообщением вместо сигнализации активности; пусто для обычного перехвата'
        - setColumnRemarks:
            tableName: outbox
            columnName: id
            remarks: 'Первичный ключ записи; одновременно стабильный messageId для дедупликации потребителем при at-least-once доставке'
        - setColumnRemarks:
            tableName: outbox
            columnName: payload
            remarks: 'JSON-тело сообщения для очереди; формат зависит от kind (детали job, конверт события, письмо)'
        - setColumnRemarks:
            tableName: outbox
            columnName: created_at
            remarks: 'Момент постановки записи в очередь'
        - setColumnRemarks:
            tableName: outbox
            columnName: published
            remarks: 'Флаг доставки; ставится только после ACK брокера, до этого запись переиздаётся при следующем опросе'
        - setColumnRemarks:
            tableName: outbox
            columnName: attempts
            remarks: 'Число неудачных попыток обработки записи; по достижении лимита запись уходит в карантин'
        - setColumnRemarks:
            tableName: outbox
            columnName: last_error
            remarks: 'Усечённый текст последней ошибки обработки (до 500 символов); null — ошибок ещё не было'
        - setColumnRemarks:
            tableName: outbox
            columnName: status
            remarks: 'Состояние обработки: PENDING — в очереди, FAILED — карантин после исчерпания ретраев'
        - setColumnRemarks:
            tableName: outbox
            columnName: kind
            remarks: 'Явный тип записи (SERVICE_TASK, DOMAIN_EVENT, EMAIL), задаётся продюсером; маршрутизация идёт по нему, а не по содержимому payload'
        - setColumnRemarks:
            tableName: parallel_gateways
            columnName: id
            remarks: 'Первичный ключ записи о прибытии одной ветки на шлюз-слияние'
        - setColumnRemarks:
            tableName: parallel_gateways
            columnName: process_instance_id
            remarks: 'Ссылка на process_instances.id — экземпляр, в котором сошлись ветки'
        - setColumnRemarks:
            tableName: parallel_gateways
            columnName: gateway_element_id
            remarks: 'Id шлюза-слияния в BPMN-модели, на который прибыла ветка'
        - setColumnRemarks:
            tableName: parallel_gateways
            columnName: entered_flow_id
            remarks: 'Id входящего sequence flow, по которому ветка пришла на слияние; у маркерной строки inclusive-слияния равен id шлюза'
        - setColumnRemarks:
            tableName: parallel_gateways
            columnName: created_at
            remarks: 'Момент фиксации прибытия ветки на слияние'
        - setColumnRemarks:
            tableName: parallel_gateways
            columnName: expected_count
            remarks: 'Сколько веток активировал inclusive-форк и сколько прибытий ждёт слияние; заполнено только на маркерной строке, иначе null'
        - setColumnRemarks:
            tableName: password_tokens
            columnName: id
            remarks: 'Первичный ключ записи одноразовой ссылки'
        - setColumnRemarks:
            tableName: password_tokens
            columnName: user_id
            remarks: 'Пользователь из ui_users, для которого выпущена ссылка установки или сброса пароля'
        - setColumnRemarks:
            tableName: password_tokens
            columnName: type
            remarks: 'Назначение ссылки: INVITE для приглашения либо RESET для сброса пароля'
        - setColumnRemarks:
            tableName: password_tokens
            columnName: token_hash
            remarks: 'Хэш сырой одноразовой ссылки; само значение ссылки не хранится'
        - setColumnRemarks:
            tableName: password_tokens
            columnName: email
            remarks: 'Адрес, на который отправлена ссылка; используется для точечного отзыва при повторном приглашении'
        - setColumnRemarks:
            tableName: password_tokens
            columnName: expires_at
            remarks: 'Срок действия ссылки; после него установить пароль по ней нельзя'
        - setColumnRemarks:
            tableName: password_tokens
            columnName: used
            remarks: 'Флаг использования: ссылка одноразовая и после применения блокируется'
        - setColumnRemarks:
            tableName: password_tokens
            columnName: consumed_at
            remarks: 'Момент использования ссылки; пусто, пока ссылка не применена'
        - setColumnRemarks:
            tableName: password_tokens
            columnName: created_at
            remarks: 'Момент выпуска одноразовой ссылки'
        - setColumnRemarks:
            tableName: process
            columnName: id
            remarks: 'Первичный ключ строки реестра процессов; на него ссылается process_member.process_id'
        - setColumnRemarks:
            tableName: process
            columnName: definition_key
            remarks: 'Бизнес-ключ процесса (id процесса из BPMN), уникален'
        - setColumnRemarks:
            tableName: process
            columnName: name
            remarks: 'Отображаемое имя процесса'
        - setColumnRemarks:
            tableName: process
            columnName: created_at
            remarks: 'Момент создания строки реестра процесса'
        - setColumnRemarks:
