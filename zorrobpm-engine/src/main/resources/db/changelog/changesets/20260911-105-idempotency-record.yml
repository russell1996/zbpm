databaseChangeLog:
  - logicalFilePath: 20260911-105
  - changeSet:
      id: 20260911-105
      author: zorrodev
      comment: "WO-REL-21: таблица идемпотентности create-мутаций. Раунд 2: PK расширен до тройки (key, endpoint, credential_hash) - разные credential под одним key живут отдельными записями (ротация токена не затирает чужой replay). Колонка key названа idem_key: KEY - reserved word в H2 (прецедент WO-SCALE-2)."
      changes:
        - createTable:
            tableName: idempotency_record
            columns:
              - column:
                  name: idem_key
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: endpoint
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: credential_hash
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: request_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: response_status
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: response_body
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: response_content_type
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: CREATE INDEX IF NOT EXISTS idx_idempotency_record_created_at ON idempotency_record (created_at)
        - sql:
            dbms: h2
            sql: CREATE INDEX IF NOT EXISTS idx_idempotency_record_created_at ON idempotency_record (created_at)
        - sql:
            dbms: postgresql
            sql: >-
              COMMENT ON TABLE idempotency_record IS 'Идемпотентность create-мутаций (WO-REL-21): сохранённые ответы по ключу клиента';
              COMMENT ON COLUMN idempotency_record.idem_key IS 'Ключ клиента Idempotency-Key (часть PK)';
              COMMENT ON COLUMN idempotency_record.endpoint IS 'Путь эндпоинта, напр. /process-instances (часть PK)';
              COMMENT ON COLUMN idempotency_record.credential_hash IS 'SHA-256 сырых байтов Authorization-заголовка (пусто для анонимных; часть PK, раунд 2: replay скоупирован на credential)';
              COMMENT ON COLUMN idempotency_record.request_hash IS 'SHA-256 тела запроса (hex), защита от переиспользования ключа';
              COMMENT ON COLUMN idempotency_record.response_status IS 'Сохранённый HTTP-статус для replay';
              COMMENT ON COLUMN idempotency_record.response_body IS 'Сохранённое тело ответа для replay';
              COMMENT ON COLUMN idempotency_record.response_content_type IS 'Content-Type сохранённого ответа';
              COMMENT ON COLUMN idempotency_record.created_at IS 'Момент сохранения (TTL-очистка по нему)';
      rollback:
        # WO-OPS-15: index + COMMENTs die with the table — no separate inverses needed.
        - dropTable:
            tableName: idempotency_record
