databaseChangeLog:
  - logicalFilePath: 20260710-043
  - changeSet:
      id: 20260710-043
      author: zorrodev
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox
              - column:
                  name: payload
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime with timezone
                  constraints:
                    nullable: false
              - column:
                  name: published
                  type: boolean
                  constraints:
                    nullable: false
                    defaultValueBoolean: false
