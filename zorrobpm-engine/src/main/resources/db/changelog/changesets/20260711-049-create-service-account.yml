databaseChangeLog:
  - changeSet:
      id: 20260711-049-create-service-account
      author: mimo
      changes:
        - createTable:
            tableName: service_account
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: process_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: key_hash
                  type: varchar(512)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: prefix
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime with timezone
                  constraints:
                    nullable: false
              - column:
                  name: last_used_at
                  type: datetime with timezone
              - column:
                  name: expires_at
                  type: datetime with timezone
              - column:
                  name: revoked_at
                  type: datetime with timezone
        - addForeignKeyConstraint:
            baseTableName: service_account
            baseColumnNames: process_id
            referencedTableName: process
            referencedColumnNames: id
            constraintName: fk_service_account_process
        - createTable:
            tableName: service_account_permission
            columns:
              - column:
                  name: service_account_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: permission
                  type: varchar(32)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: service_account_permission
            columnNames: service_account_id, permission
        - addForeignKeyConstraint:
            baseTableName: service_account_permission
            baseColumnNames: service_account_id
            referencedTableName: service_account
            referencedColumnNames: id
            constraintName: fk_sa_permission_sa
