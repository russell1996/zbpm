databaseChangeLog:
  - logicalFilePath: 20260428-019
  - changeSet:
      id: 20260428-019
      author: zorrodev
      changes:
        - addColumn:
            tableName: variables
            columns:
              - column:
                  name: id
                  type: uuid
        - sql:
            dbms: postgresql
            sql: UPDATE variables SET id = gen_random_uuid() WHERE id IS NULL
        - sql:
            dbms: h2
            sql: UPDATE variables SET id = random_uuid() WHERE id IS NULL
        - addNotNullConstraint:
            tableName: variables
            columnName: id
            columnDataType: uuid
        - dropPrimaryKey:
            tableName: variables
            constraintName: pk_variables
        - addPrimaryKey:
            tableName: variables
            columnNames: id
            constraintName: pk_variables
        - addUniqueConstraint:
            tableName: variables
            columnNames: process_instance_id, name
            constraintName: uk_variables__process_instance_id_name
      rollback:
        # WO-OPS-15: full reverse of the PK swap. The backfill UPDATE has no
        # inverse (generated UUIDs vanish with the dropped column). Pre-019 PK
        # was (process_instance_id, name) — see 20251008-005.
        - dropUniqueConstraint:
            tableName: variables
            constraintName: uk_variables__process_instance_id_name
        - dropPrimaryKey:
            tableName: variables
        - addPrimaryKey:
            tableName: variables
            columnNames: process_instance_id, name
            constraintName: pk_variables
        - dropColumn:
            tableName: variables
            columnName: id
