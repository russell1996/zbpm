databaseChangeLog:
  - logicalFilePath: 20260905-094
  - changeSet:
      id: 20260905-094
      author: zorrodev
      changes:
        # WO-C8-23: биндинг формы, за которым закреплена задача (зеркало formKey/formId) —
        # пишется при создании задачи из элемента. Nullable: key/external-модели идут
        # прежними путями.
        - addColumn:
            tableName: user_tasks
            columns:
              - column:
                  name: binding_type
                  type: varchar(32)
                  remarks: 'Биндинг формы задачи (WO-C8-23); null/latest — обычный путь'
