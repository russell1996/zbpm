databaseChangeLog:
  - logicalFilePath: 20260621-037
  - changeSet:
      id: 20260621-037
      author: zorrodev
      changes:
        - addColumn:
            tableName: timer_jobs
            columns:
              - column:
                  name: process_instance_id
                  type: uuid
              - column:
                  name: event_subprocess_id
                  type: varchar(255)
        # event-subprocess timer jobs have no host activity
        - dropNotNullConstraint:
            tableName: timer_jobs
            columnName: activity_id
            columnDataType: uuid
