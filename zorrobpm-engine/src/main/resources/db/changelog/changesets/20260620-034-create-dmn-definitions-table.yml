databaseChangeLog:
  - logicalFilePath: 20260620-034
  - changeSet:
      id: 20260620-034
      author: zorrodev
      changes:
        - createTable:
            tableName: dmn_definitions
            columns:
              - column:
                  name: decision_id
                  type: varchar(255)
