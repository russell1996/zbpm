databaseChangeLog:
  - logicalFilePath: 20261005-117
  - changeSet:
      id: 20261005-117-armed-timer-jobs-instance-pg
      author: zorrodev
      dbms: postgresql
      runInTransaction: false
      comment: >-
        WO-C8-35 (CR-09, ШАГ D): индекс под чтение «взведённые триггеры этого инстанса»
        (TimerJobRepository.findArmedTimerJobs — WHERE process_instance_id = ? AND fired = false
        AND boundary_element_id IS NOT NULL). Это чтение на горячем пути: вселенная
        «ещё может доставить» для inclusive-join опрашивается на КАЖДЫЙ приход ветви и
        на каждой деактивации, то есть на каждый элемент инстанса за его жизнь.
        Индекса по process_instance_id у timer_jobs не было вообще (все три существующих
        индекса ведут от activity_id / fired+due_at), поэтому выборка шла полным
        Seq Scan по растущей таблице — подтверждено EXPLAIN на живой БД до миграции:
        «Seq Scan on timer_jobs (Filter: ((NOT fired) AND (boundary_element_id IS NOT
        NULL) AND (process_instance_id = ...)))».
        Частичный предикат — ровно этот запрос: в индексе только ещё не выстрелявшие
        граничные таймеры, а не вся таблица (сработавшие и промежуточные catch-таймеры
        в него не попадают). CREATE INDEX CONCURRENTLY + runInTransaction:false —
        создание не блокирует запись на проде (та же форма, что в 20260928-116:
        CONCURRENTLY структурно не выполняется внутри транзакции). PostgreSQL-only:
        H2 не понимает ни CONCURRENTLY, ни WHERE в CREATE INDEX.
      changes:
        - sql:
            sql: >-
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_timer_jobs__armed_by_instance
              ON timer_jobs (process_instance_id)
              WHERE fired = false AND boundary_element_id IS NOT NULL
        - sql:
            sql: >-
              COMMENT ON INDEX idx_timer_jobs__armed_by_instance IS 'WO-C8-35: индекс под
              чтение взведённых триггеров инстанса для правила готовности inclusive-join
              (только несработавшие граничные таймеры)'
      rollback:
        - sql:
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_timer_jobs__armed_by_instance

  - changeSet:
      id: 20261005-117-armed-timer-jobs-instance-h2
      author: zorrodev
      dbms: h2
      comment: >-
        WO-C8-35 (CR-09, ШАГ D): тестовый профиль. H2 не выражает ни CONCURRENTLY, ни
        частичный предикат — обычный индекс по process_instance_id даёт ту же форму
        запроса для локальных прогонов; настоящая гарантия (Seq Scan → Index Scan) и
        сам частичный предикат проверяются на PostgreSQL (ArmedBoundaryTimerJoinPgIT,
        job test:pg).
      changes:
        - createIndex:
            tableName: timer_jobs
            indexName: idx_timer_jobs__armed_by_instance
            columns:
              - column:
                  name: process_instance_id
      rollback:
        - dropIndex:
            tableName: timer_jobs
            indexName: idx_timer_jobs__armed_by_instance