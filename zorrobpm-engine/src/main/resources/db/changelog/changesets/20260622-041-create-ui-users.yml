databaseChangeLog:
  - logicalFilePath: 20260622-041
  - changeSet:
      id: 20260622-041
      author: zorrodev
      changes:
        - createTable:
            tableName: ui_users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_ui_users
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_ui_users__username
              - column:
                  name: password_hash
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: text
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: role
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime with timezone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: datetime with timezone
