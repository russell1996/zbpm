# WO-PROC-8: PG-test profile — overrides datasource for CI/PG-IT.
# PostgresIT base class reads PG_HOST/PG_PORT/PG_DB/PG_USER/PG_PASSWORD from system properties.
spring.datasource.url=jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DB:zorrobpm-db}?sslmode=disable
spring.datasource.username=${PG_USER:zorrodev}
spring.datasource.password=${PG_PASSWORD:zorrodev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.liquibase.enabled=true
spring.hikari.connection-timeout=60000
