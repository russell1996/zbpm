# PGTest profile — connects to local postgres:16 (docker-compose or standalone).
spring.datasource.url=jdbc:postgresql://localhost:5432/zbpm_test?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.liquibase.enabled=true
spring.rabbitmq.listener.simple.auto-startup=false
spring.hikari.connection-timeout=60000
spring.hikari.maximum-pool-size=5
