# PGTest profile — connects to local PostgreSQL.
# Default: docker-compose postgres (host: postgres, port: 5432)
# Or standalone: localhost:5432
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/zbpm_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.liquibase.enabled=true
spring.rabbitmq.listener.simple.auto-startup=false
spring.hikari.connection-timeout=60000
spring.hikari.maximum-pool-size=5
