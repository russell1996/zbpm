spring.datasource.url=jdbc:h2:mem:test

app.filesDir=target/files

spring.rabbitmq.listener.simple.auto-startup=false

# WO-REL-13: park the background TimerScheduler poller in tests. Every test drives
# processBatch()/fire() explicitly, and the poller's 5 s tick would race with those calls
# (WO-REL-13 fire is REQUIRES_NEW and commits per-job, so a background fire would leave
# fired=true timer jobs that pollute the shared H2 database for later tests).
zorrobpm.engine.timer-poll-interval-ms=3600000

