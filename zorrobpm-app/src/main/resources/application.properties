spring.application.name=zorrobpm-app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zorrobpm-db}
spring.datasource.username=${DB_USERNAME:zorrodev}
spring.datasource.password=${DB_PASSWORD:zorrodev}

app.filesDir=${APP_FILES_DIR:${user.home}/.zorrobpm/files}

spring.rabbitmq.addresses=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:zorrodev}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:zorrodev}

spring.rabbitmq.requested-heartbeat=10
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.missing-queues-fatal=true

# WO-REL-12 (R-02): broker publisher confirms + mandatory returns. Outbox rows are marked
# published only after the broker ACKs (see RabbitConfiguration + OutboxDeliveryResultListener).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# A failed service-task completion is retried a few times with backoff, then rejected without
# requeue so it is dead-lettered (see RabbitConfiguration) instead of being redelivered forever.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=30s

# WO-REL-42 (WB-001 + P-7): explicit listener tuning instead of Spring AMQP defaults
# (AUTO-ack, prefetch ~250, unbounded concurrency). Same listener.simple.* namespace
# the boot factory already reads — no custom factory bean, both consumer paths
# (@RabbitListener on complete-service-task and HandlerAutoConfiguration job
# containers) pick these up.
#
# prefetch=10: one consumer holds at most 10 unacked messages — a slow handler can
# no longer hoard hundreds while siblings idle, and a process restart redelivers
# at most 10 per consumer (measured live, see report). Range per WO is 5-20.
# concurrency=3/max=5 (complete-queue): P-7 asked to lift the узкое 1/1; job
# handlers fan out per type, 3 steady + burst to 5 matches soak headroom.
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=5
# AcknowledgeMode stays AUTO (default): JobCompletionListener (WO-REL-36) relies on
# container-ack-after-return + its own result-cache idempotency for redeliveries;
# MANUAL would re-drive handleJob() on every redelivery for handlers without a
# correlationId, breaking the exactly-once-effect guarantee REL-36 proves.

server.forward-headers-strategy=framework

# Accept enum request values regardless of letter case, e.g. process-variable "type"
# may be sent as "STRING" or "string" (previously only upper-case was accepted -> HTTP 400).
spring.jackson.mapper.accept-case-insensitive-enums=true

# WO-OPS-1: expose only /actuator/health (other actuator endpoints remain under auth)
# WO-AUDIT-1 (TD7): + prometheus — rest-only exposure lost to this file on the runtime
# classpath (Spring loads ONE application.properties, the app's wins) → /actuator/prometheus
# was 404 in prod. Same posture as WO-OBS-1 on rest: health public, prometheus behind
# auth (JwtAuthFilter deny-by-default, service API key scrape).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized

# Spring Boot auto-registers a mail health contributor once spring.mail.host resolves to any
# value (including empty) — it then reports DOWN whenever the SMTP transport isn't configured,
# dragging the aggregate /actuator/health status (and the Docker HEALTHCHECK built on it) down
# with it, even though the app itself is healthy. WO-INT-5/WO-INT-6 already ship a purpose-built
# MailHealthService (GET /admin/mail/health) that reports mail reachability correctly without
# affecting the app's own liveness/readiness — the generic Boot indicator is redundant with it
# and actively wrong here, so it's disabled.
management.health.mail.enabled=false

# springdoc-openapi-starter-webmvc-ui 3.0.3 defaults both of these to false (verified via the
# jar's own spring-configuration-metadata.json) - Swagger UI/OpenAPI docs were never actually
# reachable without this. Still gated by JwtAuthFilter's deny-by-default (WO-SEC-26); this only
# turns the UI generation on, it does not bypass auth.
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# WO-INT-5: mail transport — all values from env, no secrets in repo
spring.mail.host=${ZORROBPM_MAIL_HOST:}
spring.mail.port=${ZORROBPM_MAIL_PORT:}
spring.mail.username=${ZORROBPM_MAIL_USERNAME:}
spring.mail.password=${ZORROBPM_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# WO-INT-5: mail business config
zorrobpm.mail.host=${ZORROBPM_MAIL_HOST:}
zorrobpm.mail.port=${ZORROBPM_MAIL_PORT:}
zorrobpm.mail.username=${ZORROBPM_MAIL_USERNAME:}
zorrobpm.mail.password=${ZORROBPM_MAIL_PASSWORD:}
zorrobpm.mail.from=${ZORROBPM_MAIL_FROM:}
zorrobpm.mail.allowed-recipients=${ZORROBPM_MAIL_ALLOWED_RECIPIENTS:}
# WO-INT-6: missing from the original mapping — MailSettingsCrypto reads this property, not the
# raw env var name, so without this line the key is never actually seen regardless of the env var
# being set (found live: saving mail settings kept failing "encryption key is not configured"
# even after ZORROBPM_MAIL_PASSWORD_ENCRYPTION_KEY was set on the host).
zorrobpm.mail.password-encryption-key=${ZORROBPM_MAIL_PASSWORD_ENCRYPTION_KEY:}

# WO-REL-23: graceful shutdown — active HTTP/SSE requests drain for up to 25s on SIGTERM
# (k8s/docker stop grace period), task scheduler stops after web layer.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# WO-SEC-62: container-level backstop for giant request bodies (6 MB, deliberately
# a hair above the 5M-char BPMN @Size cap: wire bytes >= string chars due to JSON
# escaping of XML quotes, so an exactly-5M upload must not die here with a bare
# container 413 — the precise 5M-char JSON 413 comes from @Valid/BPMN_TOO_LARGE).
server.tomcat.max-http-post-size=6MB
server.tomcat.max-swallow-size=6MB

# WO-REL-23: explicit Hikari — 15/instance ×3 replicas = 45 total, headroom under Postgres
# default max_connections=100; leaves room for admin/psql. 10 would be safe but 15 gives
# burst headroom for soak (WO-SCALE-3: 12k instances/4h) without pool exhaustion.
# leak-detection 60s catches unclosed connections in dev/CI (off in prod by default if noisy).
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# WO-SEC-59 #5: @Scheduled tasks (outbox poller, timers, retention) share a single thread by default;
# one blocked task (e.g. outbox waiting on an unreachable broker) stalls all the others. Give the
# scheduler its own pool.
spring.task.scheduling.pool.size=4
