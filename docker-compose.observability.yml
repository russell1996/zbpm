# WO-OBS-2: observability overlay — Prometheus + Grafana + exporters.
# Usage: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# (principle 3: separate file, not lines in the main compose). All services join
# the same zorrobpm network so app/postgres/rabbitmq are reachable by service name.
# Memory limits are explicit — b2b-test-vm has 7.8 GiB (5.9 available), 4 CPU.
name: zorrobpm

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: zorrobpm-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      # WO-OBS-4: serve the UI from under /prometheus/ (nginx subpath, same as
      # Grafana serve_from_sub_path). external-url proven live below; without the
      # route-prefix the UI's asset links break off-root. Host part is env-driven
      # (dev default = this host's frontend port; prod override in its own .env).
      - '--web.route-prefix=/prometheus/'
      - '--web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost:18081/prometheus/}'
    volumes:
      - ./ci/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ci/observability/scrape-token:/etc/prometheus/scrape-token:ro
      - prometheus-data:/prometheus
    networks:
      - zorrobpm
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    # no ports published — access via Grafana (datasource proxy) only

  grafana:
    image: grafana/grafana:11.4.0
    container_name: zorrobpm-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_LOGIN_FORM: "false"
      # WO-OBS-4: shared ZBPM login via nginx auth_request + Grafana auth.proxy.
      # Identity comes ONLY from X-WEBAUTH-* headers set by nginx (see nginx.conf
      # /grafana/ + /_zbpm_auth); auto-signup maps every valid ZBPM session.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: "Role:X-WEBAUTH-ROLE"
      GF_AUTH_PROXY_SYNC_TTL: "60"
      # WO-OBS-4: MANDATORY whitelist — without it anyone reaching Grafana directly
      # (bypassing nginx) could forge identity via header. Value = the nginx
      # container's STATIC IP /32 (defined in docker-compose.yml: frontend.networks.zorrobpm.ipv4_address).
      # NOT the whole 172.18.0.0/16 subnet — that would let any compose
      # container (e.g. app at 172.18.0.9) forge identity, which is exactly
      # what criterion 4 rules out. No grafana ports are published (see below),
      # so the real boundary is network membership; this is defense-in-depth.
      # Fail-closed: wrong/absent value breaks proxy-auth back to the admin
      # login form (criterion 6), never to open access.
      GF_AUTH_PROXY_WHITELIST: ${GRAFANA_PROXY_WHITELIST:-172.18.0.3/32}
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      # WO-OBS-5: webhook for alerts — OFF by default (empty → dummy URL, Firing without notification, principle 5)
      GRAFANA_ALERT_WEBHOOK_URL: ${GRAFANA_ALERT_WEBHOOK_URL:-http://localhost:0}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ci/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ci/observability/grafana/dashboards:/etc/grafana/dashboards:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - zorrobpm
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    # no ports published — access via nginx /grafana subpath only

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: zorrobpm-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-zorrodev}:${DB_PASSWORD:-zorrodev}@postgres:5432/${DB_NAME:-zorrobpm-db}?sslmode=disable"
      DATA_SOURCE_URI: "postgres:5432/${DB_NAME:-zorrobpm-db}?sslmode=disable"
      DATA_SOURCE_USER: "${DB_USERNAME:-zorrodev}"
      DATA_SOURCE_PASS: "${DB_PASSWORD:-zorrodev}"
    networks:
      - zorrobpm
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: zorrobpm-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    volumes:
      - /:/host:ro,rslave
    networks:
      - zorrobpm
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

volumes:
  prometheus-data:
  grafana-data:

networks:
  zorrobpm:
    driver: bridge
