spring.application.name=zorrobpm-app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zorrobpm-db}
spring.datasource.username=${DB_USERNAME:zorrodev}
spring.datasource.password=${DB_PASSWORD:zorrodev}

app.filesDir=${APP_FILES_DIR:${user.home}/.zorrobpm/files}

spring.rabbitmq.addresses=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:zorrodev}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:zorrodev}

spring.rabbitmq.requested-heartbeat=10
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.missing-queues-fatal=true

# Transport of service task jobs: rabbitmq (default) or grpc (workers connect to the gRPC port).
zorrobpm.transport=${ZORROBPM_TRANSPORT:rabbitmq}
zorrobpm.grpc.port=${ZORROBPM_GRPC_PORT:9090}

server.forward-headers-strategy=framework

spring.ai.mcp.server.name=zorrobpm-mcp
spring.ai.mcp.server.protocol=streamable

# Sentry: errors and traces. Without SENTRY_DSN the SDK stays off and nothing leaves the process.
# No personal data: no user, IP, cookies, Authorization or request bodies (see README, "Sentry").
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:}
sentry.release=${SENTRY_RELEASE:@project.version@}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
sentry.send-default-pii=false
sentry.max-request-body-size=none
sentry.tags.application=${spring.application.name}
# ERROR log records become events, INFO and above ride along as breadcrumbs.
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=info
# After Spring's own resolvers: exceptions they turn into 4xx (@ExceptionHandler,
# ResponseStatusException, standard MVC failures) are expected refusals and are not reported.
sentry.exception-resolver-order=2147483647
