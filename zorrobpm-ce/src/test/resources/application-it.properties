# Added to the application's own application.properties (profile "it"; not "test", which swaps engine services for stubs), so the Sentry settings under
# test are the shipped ones.
spring.datasource.url=jdbc:h2:mem:app;DB_CLOSE_DELAY=-1
app.filesDir=target/files

# No broker in the tests: the listeners stay down, so nothing connects to RabbitMQ.
spring.rabbitmq.listener.simple.auto-startup=false
zorrobpm.timers.enabled=false
